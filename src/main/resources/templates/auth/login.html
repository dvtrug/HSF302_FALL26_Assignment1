<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head>
<body class="bg-dark text-light min-vh-100 d-flex flex-column">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card bg-secondary bg-opacity-25 border-secondary text-light shadow-lg rounded-4 p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <span class="fs-1">🎬</span>
                        <h2 class="fw-bold text-warning mt-2">Đăng Nhập</h2>
                        <p class="text-secondary small">Chào mừng bạn quay trở lại với FU Cinema</p>
                    </div>

                    <form th:action="@{/login}" th:object="${loginForm}" method="post">
                        <input type="hidden" name="redirect" th:value="${redirect}" />

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Tên đăng nhập</label>
                            <input type="text"
                                   id="username"
                                   th:field="*{username}"
                                   class="form-control bg-dark text-light border-secondary"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                   placeholder="Nhập tên đăng nhập"
                                   required />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                            <input type="password"
                                   id="password"
                                   th:field="*{password}"
                                   class="form-control bg-dark text-light border-secondary"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   placeholder="Nhập mật khẩu"
                                   required />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mb-3 shadow-sm">
                            Đăng nhập
                        </button>
                    </form>

                    <div class="text-center mb-4">
                        <span class="text-secondary">Chưa có tài khoản? </span>
                        <a th:href="@{/register}" class="text-warning text-decoration-none fw-semibold">Đăng ký ngay</a>
                    </div>

                    <!-- Gợi ý tài khoản mẫu -->
                    <div class="border-top border-secondary pt-3 mt-2">
                        <p class="small text-secondary mb-2 fw-semibold">🔑 Tài khoản mẫu thử nghiệm:</p>
                        <ul class="list-unstyled small text-secondary mb-0">
                            <li>• <strong>Admin:</strong> <code>admin</code> / <code>Admin@123</code></li>
                            <li>• <strong>Customer:</strong> <code>customer1</code> / <code>123456</code></li>
                            <li>• <strong>Tài khoản bị khóa:</strong> <code>locked_user</code> / <code>123456</code></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
