<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Đơn đặt vé')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h3 class="mb-3">Đơn đặt vé</h3>

    <form class="row g-2 mb-3" method="get"
          th:action="@{/admin/bookings}">
        <div class="col-md-2">
            <select class="form-select" name="status"
                    aria-label="Trạng thái">
                <option value="">Tất cả trạng thái</option>
                <option th:each="s : ${statuses}"
                        th:value="${s}"
                        th:text="${s}"
                        th:selected="${s == status}"></option>
            </select>
        </div>

        <div class="col-md-2">
            <input type="date" class="form-control" name="from"
                   th:value="${from}" aria-label="Từ ngày">
        </div>
        <div class="col-md-2">
            <input type="date" class="form-control" name="to"
                   th:value="${to}" aria-label="Đến ngày">
        </div>
        <div class="col-md-4">
            <input class="form-control" name="kw" th:value="${kw}"
                   placeholder="Tên, email, SĐT khách hàng"
                   aria-label="Từ khóa khách hàng">
        </div>
        <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-outline-primary">Lọc</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Mã đơn</th>
                <th>Ngày đặt</th>
                <th>Khách hàng</th>
                <th>Phim</th>
                <th>Suất chiếu</th>
                <th>Tổng tiền</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${bookings.empty}">
                <td colspan="8" class="text-center text-muted">
                    Không có dữ liệu
                </td>
            </tr>
            <tr th:each="b : ${bookings.content}">
                <td th:text="${b.bookingId}"></td>
                <td th:text="${#temporals.format(b.bookingDate, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${b.customer.fullName}"></td>
                <td th:text="${b.showtime.movie.title}"></td>
                <td th:text="${#temporals.format(b.showtime.startTime, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="|${#numbers.formatDecimal(b.totalAmount, 0, 'COMMA', 0, 'POINT')} đ|"></td>
                <td th:text="${b.status}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/admin/bookings/{id}(id=${b.bookingId})}">
                        Chi tiết
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/layout :: pagination(${bookings}, ${pageUrl})}"></div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
